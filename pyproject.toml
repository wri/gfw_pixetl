[project]
name = "gfw_pixetl"
version = "1.9.1a1"
description = "Tool to preprocess GFW tiles"
authors = [{ name = "Thomas Maschler" }]
license = { text = "MIT" }
requires-python = "~=3.12.14"

# Production dependencies (formerly [packages] in Pipfile)
dependencies = [
    "aenum",
    "boto3",
    "click",
    "dill",
    "geojson",
    "geopandas",
    "google-cloud-storage",
    "numpy==2.2.6",
    "pandas==2.3.2",
    "psutil",
    "psycopg2<3",
    "pyarrow",
    "pydantic<2",
    "pyproj",
    "rasterio==1.5.1",  # Upgrade carefully – tightly coupled to GDAL version
    "retrying",
    "PyYAML",
    "Shapely",
    "SQLAlchemy>=2.0,<2.1",
    "typer",
]

[project.optional-dependencies]
# Dev/test dependencies (formerly [dev-packages] in Pipfile)
dev = [
    "moto[s3,secretsmanager]<5",
    "pre-commit",
    "pytest",
    "pytest-cov",
]

[project.scripts]
pixetl      = "gfw_pixetl.pixetl:cli"
pixetl_prep = "gfw_pixetl.pixetl_prep:cli"

[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["tests*"]

# ── UV configuration ───────────────────────────────────────────────────────────
[tool.uv]
# Packages that must be provided by the base image's system site-packages
# (i.e. the GDAL Python bindings). UV will not attempt to install these.
no-binary-package = []

[tool.uv.sources]
# No custom index sources needed; everything comes from PyPI.
